<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulazione Download (esercizio_2905206)</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
    <style></style>
  </head>
  <body>
    <div class="download-box">
      <h2 class="text-center mb-4">Simulazione Download</h2>

      <!-- Barra -->
      <div class="progress">
        <div
          id="progressBar"
          class="progress-bar progress-bar-striped progress-bar-animated bg-success"
          role="progressbar"
          style="width: 0%"
        >
          0%
        </div>
      </div>

      <!-- Percentuale -->
      <div class="percentuale" id="percentuale">0%</div>

      <!-- Pulsanti -->
      <div class="btn-group-custom">
        <button class="btn btn-primary" id="startBtn">Avvia Download</button>

        <button class="btn btn-warning" id="pauseBtn">Pausa</button>

        <button class="btn btn-success" id="resumeBtn">Riprendi</button>

        <button class="btn btn-danger" id="cancelBtn">Annulla</button>
      </div>
    </div>

    <!-- MODALE BOOTSTRAP -->
    <div class="modal fade" id="downloadModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Messaggio</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body" id="modalMessage">Download Completato!</div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Chiudi
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="main.js"></script>
  </body>
</html>
